name: iOS Cloud Build

on:
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-cloud-build.yml"
  workflow_dispatch:
    inputs:
      upload_to_app_store:
        description: "Sign and upload build 1.0 to App Store Connect"
        required: true
        default: false
        type: boolean

concurrency:
  group: ios-cloud-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Build and test on cloud Mac
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out Parslia
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Run iOS unit tests
        working-directory: ios
        run: |
          SIMULATOR_ID="$(xcrun simctl list devices available -j | jq -r '[.devices[] | .[] | select(.name | startswith("iPhone"))][0].udid')"
          if [ -z "$SIMULATOR_ID" ] || [ "$SIMULATOR_ID" = "null" ]; then
            echo "No available iPhone simulator was found."
            exit 1
          fi
          xcodebuild test \
            -project Parslia.xcodeproj \
            -scheme Parslia \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            CODE_SIGNING_ALLOWED=NO

  upload:
    name: Sign and upload to App Store Connect
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_to_app_store }}
    runs-on: macos-15
    timeout-minutes: 45
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
    steps:
      - name: Check out Parslia
        uses: actions/checkout@v4

      - name: Verify Apple signing secrets
        shell: bash
        run: |
          missing=0
          for secret_name in APPLE_TEAM_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_PRIVATE_KEY; do
            if [ -z "${!secret_name}" ]; then
              echo "Missing required GitHub secret: $secret_name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Install App Store Connect private key
        shell: bash
        run: |
          KEY_DIRECTORY="$RUNNER_TEMP/appstoreconnect/private_keys"
          mkdir -p "$KEY_DIRECTORY"
          KEY_PATH="$KEY_DIRECTORY/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APP_STORE_CONNECT_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Archive Parslia
        working-directory: ios
        run: |
          xcodebuild clean archive \
            -project Parslia.xcodeproj \
            -scheme Parslia \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Parslia.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$APP_STORE_CONNECT_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"

      - name: Create App Store export options
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key>
            <string>upload</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

      - name: Sign and upload Parslia
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Parslia.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/ParsliaExport" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$APP_STORE_CONNECT_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Remove signing key
        if: ${{ always() }}
        shell: bash
        run: |
          if [ -n "${APP_STORE_CONNECT_KEY_PATH:-}" ]; then
            rm -f "$APP_STORE_CONNECT_KEY_PATH"
          fi
