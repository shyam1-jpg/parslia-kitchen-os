/* Kiteline — professional commercial kitchen SOP + short videos */
:root {
  --ink: #0f172a;
  --ink-soft: #1e293b;
  --muted: #64748b;
  --teal: #0d9488;
  --teal-deep: #0f766e;
  --cyan: #5eead4;
  --paper: #f8fafc;
  --line: rgba(15, 23, 42, 0.1);
  --warn: #9a3412;
  --warn-bg: #ffedd5;
  --ok: #0f766e;
  --shadow: 0 16px 44px rgba(15, 23, 42, 0.12);
  --radius: 18px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  --tab-h: calc(64px + var(--safe-b));
  --font: "Inter", system-ui, sans-serif;
}

*,
*::before,
*::after { box-sizing: border-box; }

html, body {
  margin: 0;
  min-height: 100%;
  background:
    radial-gradient(120% 80% at 8% -12%, #99f6e4 0%, transparent 50%),
    radial-gradient(90% 70% at 100% 0%, #bae6fd 0%, transparent 42%),
    linear-gradient(180deg, #e2e8f0 0%, #f1f5f9 40%, #f8fafc 100%);
  color: var(--ink);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

body { min-height: 100dvh; }

.app {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100dvh;
  position: relative;
  padding-bottom: var(--tab-h);
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: grid;
  grid-template-columns: 44px 1fr 44px;
  gap: 8px;
  align-items: center;
  padding: calc(10px + var(--safe-t)) 14px 12px;
  background: rgba(248, 250, 252, 0.9);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
}

.topbar-text { min-width: 0; text-align: center; }

.brand-mark {
  margin: 0;
  font-size: 0.66rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--teal-deep);
  font-weight: 800;
}

.screen-title {
  margin: 2px 0 0;
  font-size: 1.12rem;
  font-weight: 800;
  letter-spacing: -0.03em;
}

.icon-btn {
  width: 44px;
  height: 44px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: #fff;
  color: var(--ink);
  font-size: 1.2rem;
  cursor: pointer;
}

.icon-btn[hidden] { visibility: hidden; }

.search-bar { padding: 8px 14px 0; }
.search-bar[hidden] { display: none; }
.search-bar input {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 14px 16px;
  font: inherit;
  background: #fff;
}

.main { padding: 16px 14px 28px; animation: rise 0.32s ease both; }

@keyframes rise {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: none; }
}

.hero {
  overflow: hidden;
  border-radius: 24px;
  padding: 24px 20px 22px;
  background:
    linear-gradient(145deg, rgba(255,255,255,0.12), transparent 42%),
    linear-gradient(160deg, #042f2e 0%, #0f766e 58%, #14b8a6 100%);
  color: #f8fafc;
  box-shadow: var(--shadow);
  margin-bottom: 16px;
}

.hero-lockup {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
}

.hero-lockup img {
  width: 48px;
  height: 48px;
  border-radius: 14px;
  background: #0f172a;
}

.hero h2 {
  margin: 0;
  font-size: 1.45rem;
  letter-spacing: -0.04em;
  line-height: 1.1;
}

.hero p { margin: 8px 0 0; color: rgba(248, 250, 252, 0.82); font-size: 0.92rem; line-height: 1.5; }

.hero-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }

.chip {
  display: inline-flex;
  padding: 6px 10px;
  border-radius: 999px;
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.18);
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.section-label {
  margin: 4px 0 10px;
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
}

.filters {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 10px;
  margin-bottom: 6px;
  -webkit-overflow-scrolling: touch;
}

.filter {
  flex: none;
  border: 1px solid var(--line);
  background: #fff;
  color: var(--ink-soft);
  border-radius: 999px;
  padding: 8px 12px;
  font-weight: 800;
  font-size: 0.78rem;
  cursor: pointer;
}

.filter.active {
  background: var(--teal-deep);
  color: #fff;
  border-color: var(--teal-deep);
}

.sop-list { display: flex; flex-direction: column; gap: 10px; }

.sop-row {
  display: grid;
  grid-template-columns: 64px 1fr 16px;
  gap: 12px;
  align-items: center;
  width: 100%;
  text-align: left;
  border: 1px solid var(--line);
  background: #fff;
  border-radius: 16px;
  padding: 12px;
  cursor: pointer;
  box-shadow: 0 8px 24px rgba(15, 23, 42, 0.04);
}

.sop-glyph {
  width: 64px;
  height: 52px;
  border-radius: 12px;
  background: #ecfdf5;
  color: var(--teal-deep);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 0.78rem;
}

.sop-row strong { display: block; font-size: 0.95rem; }
.sop-row span { display: block; color: var(--muted); font-size: 0.78rem; margin-top: 2px; line-height: 1.35; }
.chev { color: #94a3b8; }

.btn {
  width: 100%;
  border: 0;
  border-radius: 14px;
  padding: 14px 16px;
  font-weight: 800;
  background: linear-gradient(135deg, var(--teal), #2dd4bf);
  color: #042f2e;
  cursor: pointer;
}

.btn.ghost {
  background: #fff;
  border: 1px solid var(--line);
  color: var(--ink);
}

.warn-banner {
  background: var(--warn-bg);
  color: var(--warn);
  border-radius: 14px;
  padding: 12px 14px;
  font-size: 0.85rem;
  font-weight: 600;
  margin-bottom: 14px;
  line-height: 1.45;
}

.empty { text-align: center; color: var(--muted); padding: 28px 10px; }

.detail-head { margin-bottom: 14px; }
.detail-code {
  display: inline-flex;
  background: #ecfdf5;
  color: var(--teal-deep);
  font-weight: 800;
  font-size: 0.75rem;
  padding: 5px 9px;
  border-radius: 999px;
  letter-spacing: 0.06em;
}
.detail-head h2 { margin: 10px 0 6px; font-size: 1.4rem; letter-spacing: -0.04em; }
.detail-head p { margin: 0; color: var(--muted); }

.player {
  position: relative;
  border-radius: 18px;
  overflow: hidden;
  background: #042f2e;
  color: #ecfdf5;
  aspect-ratio: 16 / 10;
  margin: 0 0 16px;
  box-shadow: var(--shadow);
}

.player-stage {
  position: absolute;
  inset: 0;
  padding: 22px 18px 52px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  background:
    radial-gradient(80% 70% at 90% 0%, rgba(45, 212, 191, 0.35), transparent 50%),
    linear-gradient(180deg, #0f766e 0%, #042f2e 72%);
}

.player-kicker {
  font-size: 0.68rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  font-weight: 800;
  color: var(--cyan);
  margin: 0 0 8px;
}

.player-stage h3 { margin: 0 0 8px; font-size: 1.35rem; letter-spacing: -0.03em; }
.player-stage p { margin: 0; font-size: 0.95rem; line-height: 1.45; color: rgba(236, 253, 245, 0.9); }

.player-bar {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 44px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 12px;
  background: rgba(2, 6, 23, 0.45);
}

.player-bar button {
  border: 0;
  background: #fff;
  color: #042f2e;
  font-weight: 800;
  border-radius: 999px;
  padding: 6px 12px;
  cursor: pointer;
}

.player-progress {
  flex: 1;
  height: 6px;
  border-radius: 99px;
  background: rgba(255,255,255,0.2);
  overflow: hidden;
}

.player-progress > span {
  display: block;
  height: 100%;
  width: 0;
  background: var(--cyan);
}

.player-time { font-size: 0.72rem; font-weight: 700; color: #ccfbf1; min-width: 64px; text-align: right; }

.block {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 14px 16px;
  margin-bottom: 10px;
}

.block h3 { margin: 0 0 8px; font-size: 0.95rem; }
.block p, .block li { color: var(--ink-soft); font-size: 0.9rem; line-height: 1.5; }
.block ul { margin: 0; padding-left: 18px; }
.block li { margin: 4px 0; }

.rule-list { display: flex; flex-direction: column; gap: 8px; }
.rule {
  background: #fff;
  border-left: 4px solid var(--teal);
  border-radius: 12px;
  padding: 12px 14px;
  font-size: 0.9rem;
  line-height: 1.45;
}

.install ol { margin: 0; padding-left: 18px; }
.install li { margin: 8px 0; line-height: 1.45; }

.tabbar {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: 0;
  width: min(480px, 100%);
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 4px;
  padding: 8px 8px calc(8px + var(--safe-b));
  background: rgba(255,255,255,0.94);
  backdrop-filter: blur(12px);
  border-top: 1px solid var(--line);
}

.tab {
  border: 0;
  background: transparent;
  color: var(--muted);
  font-weight: 800;
  font-size: 0.68rem;
  padding: 6px 4px;
  border-radius: 12px;
  cursor: pointer;
}

.tab.active { color: var(--teal-deep); background: #ecfdf5; }
.tab-ico { display: block; font-size: 1.1rem; margin-bottom: 2px; }

  </style>
</head>

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function findSop(id) {
    for (var i = 0; i < DATA.sops.length; i++) {
      if (DATA.sops[i].id === id) return DATA.sops[i];
    }
    return null;
  }

  function catLabel(id) {
    for (var i = 0; i < DATA.categories.length; i++) {
      if (DATA.categories[i].id === id) return DATA.categories[i].label;
    }
    return id;
  }

  function filteredSops() {
    var q = state.query.trim().toLowerCase();
    return DATA.sops.filter(function (sop) {
      if (state.category !== "all" && sop.category !== state.category) return false;
      if (!q) return true;
      var blob = (sop.code + " " + sop.title + " " + sop.blurb + " " + catLabel(sop.category)).toLowerCase();
      sop.sections.forEach(function (sec) {
        blob += " " + sec.h;
        if (sec.body) blob += " " + sec.body;
        if (sec.bullets) blob += " " + sec.bullets.join(" ");
      });
      if (sop.video) blob += " " + sop.video.title;
      return blob.indexOf(q) !== -1;
    });
  }

  function sopRowsHtml(list) {
    if (!list.length) return '<div class="empty">No SOPs match that filter.</div>';

  function stopPlayer() {
    if (player.timer) {

  function currentScene(sop, t) {
    var scenes = sop.video.scenes;
    var cur = scenes[0];
    for (var i = 0; i < scenes.length; i++) {

    }
    return cur;
  }

  function fmtTime(sec) {

    var r = s % 60;

  }

    if (fill) fill.style.width = Math.min(100, (player.t / dur) * 100) + "%";

    var list = filteredSops();
    main.innerHTML =
      '<div class="warn-banner">Professional commercial kitchen only — hotels, restaurants, catering, schools, production. Not home cooking.</div>' +
      filterBarHtml() +
      '<p class="section-label">' +
      list.length +
      " procedures</p>" +
      sopRowsHtml(list);
  }

  function renderVideos() {
    screenTitle.textContent = "Short videos";
    brandMark.textContent = DATA.company;
    backBtn.hidden = true;
    var list = filteredSops();
    var rows = list
      .map(function (sop) {
        return (
          '<button type="button" class="sop-row" data-open="' +
          escapeHtml(sop.id) +
          '">' +
          '<span class="sop-glyph">▶</span>' +
          "<div><strong>" +
          escapeHtml(sop.video.title) +
          "</strong><span>" +
          escapeHtml(sop.code + " · " + catLabel(sop.category) + " · " + sop.video.durationSec + "s") +
          "</span></div>" +
          '<span class="chev">›</span></button>'
        );
      })
      .join("");
    main.innerHTML =
      '<p class="section-label">Sort by station</p>' +
      filterBarHtml() +
      '<p class="section-label">' +
      list.length +
      " short briefings</p>" +
      '<div class="sop-list">' +
      rows +
      "</div>";
  }

  function renderRules() {
    screenTitle.textContent = "House rules";
    brandMark.textContent = DATA.company;
    backBtn.hidden = true;
    main.innerHTML =
      '<div class="warn-banner">Post these on the pass. Every starter signs CK-00 and CK-06.</div>' +
      '<div class="rule-list">' +
      DATA.hardRules
        .map(function (r) {
          return '<div class="rule">' + escapeHtml(r) + "</div>";
        })
        .join("") +
      "</div>";
  }

  function renderInstall() {
    screenTitle.textContent = "Install";
    brandMark.textContent = DATA.company;
    backBtn.hidden = true;
    var installBtn = state.deferredPrompt
      ? '<button type="button" class="btn" id="installBtn">Install this app</button>'
      : "";
    main.innerHTML =
      '<section class="block install"><h3>Android (Chrome)</h3>' +
      "<ol><li>Open this page in Chrome.</li><li>Menu ⋮ → <b>Install app</b> or <b>Add to Home screen</b>.</li><li>Open Kitchen SOP from the home screen.</li></ol></section>" +
      '<section class="block install"><h3>iPhone / iPad (Safari)</h3>' +
      "<ol><li>Open this page in Safari.</li><li>Share □↑ → <b>Add to Home Screen</b>.</li><li>Tap Add. Works offline after first open.</li></ol></section>" +
      installBtn +
      '<p class="section-label" style="margin-top:18px">For</p>' +
      "<p>" +
      escapeHtml(DATA.audience) +
      "</p>";
  }

  function renderDetail(sop) {
    screenTitle.textContent = sop.code;
    brandMark.textContent = DATA.company;
    backBtn.hidden = false;
    var sections = sop.sections
      .map(function (sec) {
        var inner = "";
        if (sec.body) inner += "<p>" + escapeHtml(sec.body) + "</p>";
        if (sec.bullets && sec.bullets.length) {
          inner +=
            "<ul>" +
            sec.bullets
              .map(function (b) {
                return "<li>" + escapeHtml(b) + "</li>";
              })
              .join("") +
            "</ul>";
        }
        return '<article class="block"><h3>' + escapeHtml(sec.h) + "</h3>" + inner + "</article>";
      })
      .join("");

    main.innerHTML =
      '<div class="detail-head"><div class="detail-code">' +
      escapeHtml(sop.code + " · " + catLabel(sop.category)) +
      "</div><h2>" +
      escapeHtml(sop.title) +
      "</h2><p>" +
      escapeHtml(sop.blurb) +
      "</p></div>" +
      '<div class="player" id="sopPlayer">' +
      '<div class="player-stage" id="playerStage"></div>' +
      '<div class="player-bar">' +
      '<button type="button" id="playerToggle">Play</button>' +
      '<div class="player-progress"><span id="playerFill"></span></div>' +
      '<div class="player-time" id="playerTime"></div></div></div>' +
      sections;

    if (player.sopId !== sop.id) {
      player.t = 0;
      player.sopId = sop.id;
      stopPlayer();
    }
    paintPlayer(sop);
  }

  function setTabActive(tab) {
    tabs.forEach(function (btn) {
      var on = btn.getAttribute("data-tab") === tab;
      btn.classList.toggle("active", on);
      if (on) btn.setAttribute("aria-current", "page");
      else btn.removeAttribute("aria-current");
    });
  }

  function render() {
    main.style.animation = "none";
    main.offsetHeight;
    main.style.animation = "";

    if (state.sopId) {
      var sop = findSop(state.sopId);
      if (sop) {
        setTabActive(state.tab === "videos" ? "videos" : "sops");
        renderDetail(sop);
        return;
      }
      state.sopId = null;
    }

    stopPlayer();
    setTabActive(state.tab);
    if (state.tab === "home") renderHome();
    else if (state.tab === "sops") renderSops();
    else if (state.tab === "videos") renderVideos();
    else if (state.tab === "rules") renderRules();
    else renderInstall();
  }

  function goTab(tab) {
    state.tab = tab;
    state.sopId = null;
    if (tab !== "sops" && tab !== "videos") {
      state.searchOpen = false;
      searchBar.hidden = true;
    }
    render();
  }

  document.querySelector(".tabbar").addEventListener("click", function (e) {
    var btn = e.target.closest(".tab");
    if (!btn) return;
    goTab(btn.getAttribute("data-tab"));
  });

  backBtn.addEventListener("click", function () {
    state.sopId = null;
    if (state.tab !== "videos") state.tab = "sops";
    render();
  });

  searchToggle.addEventListener("click", function () {
    if (state.tab !== "videos") state.tab = "sops";
    state.sopId = null;
    state.searchOpen = !state.searchOpen;
    searchBar.hidden = !state.searchOpen;
    render();
    if (state.searchOpen) searchInput.focus();
  });

  searchInput.addEventListener("input", function () {
    state.query = searchInput.value;
    if (state.tab !== "videos") state.tab = "sops";
    state.sopId = null;
    render();
  });

  main.addEventListener("click", function (e) {
    var cat = e.target.closest("[data-cat]");
    if (cat) {
      state.category = cat.getAttribute("data-cat");
      render();
      return;
    }
    var open = e.target.closest("[data-open]");
    if (open) {
      state.sopId = open.getAttribute("data-open");
      searchBar.hidden = true;
      state.searchOpen = false;
      player.t = 0;
      stopPlayer();
      render();
      window.scrollTo(0, 0);
      return;
    }
    if (e.target.id === "gotoSops") {
      goTab("sops");
      return;
    }
    if (e.target.id === "gotoVideos") {
      goTab("videos");
      return;
    }
    if (e.target.id === "gotoInstall") {
      goTab("install");
      return;
    }
    if (e.target.id === "playerToggle") {
      var sop = findSop(state.sopId);
      if (!sop) return;
      if (player.playing) {
        player.playing = false;
        stopPlayer();
        paintPlayer(sop);
      } else {
        if (player.t >= sop.video.durationSec) player.t = 0;
        startPlayer(sop);
      }
      return;
    }
    if (e.target.id === "installBtn" && state.deferredPrompt) {
      state.deferredPrompt.prompt();
      state.deferredPrompt.userChoice.finally(function () {
        state.deferredPrompt = null;
        render();
      });
    }
  });

  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    state.deferredPrompt = e;
  });

  if (false && "serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js").catch(function () {});
    });
  }

  render();
})();

  </script>
</body>
</html>
