<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <title>Kiteline · Kitchen SOP</title>
  <style>/* Kiteline — professional commercial kitchen SOP + short videos */
:root {
  --ink: #0f172a;
  --ink-soft: #1e293b;
  --muted: #64748b;
  --teal: #0d9488;
  --teal-deep: #0f766e;
  --cyan: #5eead4;
  --paper: #f8fafc;
  --line: rgba(15, 23, 42, 0.1);
  --warn: #9a3412;
  --warn-bg: #ffedd5;
  --ok: #0f766e;
  --shadow: 0 16px 44px rgba(15, 23, 42, 0.12);
  --radius: 18px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  --tab-h: calc(64px + var(--safe-b));
  --font: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}

*,
*::before,
*::after { box-sizing: border-box; }

html, body {
  margin: 0;
  min-height: 100%;
  background:
    radial-gradient(120% 80% at 8% -12%, #99f6e4 0%, transparent 50%),
    radial-gradient(90% 70% at 100% 0%, #bae6fd 0%, transparent 42%),
    linear-gradient(180deg, #e2e8f0 0%, #f1f5f9 40%, #f8fafc 100%);
  color: var(--ink);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

body { min-height: 100dvh; }

.network-status {
  position: sticky; top: 0; z-index: 40; padding: 9px 14px; text-align: center;
  background: #7c2d12; color: #fff; font-size: .78rem; font-weight: 800;
}

.app {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100dvh;
  position: relative;
  padding-bottom: var(--tab-h);
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: grid;
  grid-template-columns: 44px 1fr 44px;
  gap: 8px;
  align-items: center;
  padding: calc(10px + var(--safe-t)) 14px 12px;
  background: rgba(248, 250, 252, 0.9);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
}

.topbar-text { min-width: 0; text-align: center; }

.brand-mark {
  margin: 0;
  font-size: 0.66rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--teal-deep);
  font-weight: 800;
}

.screen-title {
  margin: 2px 0 0;
  font-size: 1.12rem;
  font-weight: 800;
  letter-spacing: -0.03em;
}

.icon-btn {
  width: 44px;
  height: 44px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: #fff;
  color: var(--ink);
  font-size: 1.2rem;
  cursor: pointer;
}

.icon-btn[hidden] { visibility: hidden; }

.search-bar { padding: 8px 14px 0; }
.search-bar[hidden] { display: none; }
.search-bar input {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 14px 16px;
  font: inherit;
  background: #fff;
}

.main { padding: 16px 14px 28px; animation: rise 0.32s ease both; }

@keyframes rise {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: none; }
}

.hero {
  overflow: hidden;
  border-radius: 24px;
  padding: 24px 20px 22px;
  background:
    linear-gradient(145deg, rgba(255,255,255,0.12), transparent 42%),
    linear-gradient(160deg, #042f2e 0%, #0f766e 58%, #14b8a6 100%);
  color: #f8fafc;
  box-shadow: var(--shadow);
  margin-bottom: 16px;
}

.hero-lockup {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
}

.hero-lockup img {
  width: 48px;
  height: 48px;
  border-radius: 14px;
  background: #0f172a;
}

.hero h2 {
  margin: 0;
  font-size: 1.45rem;
  letter-spacing: -0.04em;
  line-height: 1.1;
}

.hero p { margin: 8px 0 0; color: rgba(248, 250, 252, 0.82); font-size: 0.92rem; line-height: 1.5; }

.hero-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }

.hero-url { margin: 12px 0 0; font-size: 0.78rem; }
.hero-url a { color: var(--cyan); font-weight: 700; text-decoration: none; }

.chip {
  display: inline-flex;
  padding: 6px 10px;
  border-radius: 999px;
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.18);
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.section-label {
  margin: 4px 0 10px;
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
}

.filters {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 10px;
  margin-bottom: 6px;
  -webkit-overflow-scrolling: touch;
}

.filter {
  flex: none;
  border: 1px solid var(--line);
  background: #fff;
  color: var(--ink-soft);
  border-radius: 999px;
  padding: 8px 12px;
  font-weight: 800;
  font-size: 0.78rem;
  cursor: pointer;
}

.filter.active {
  background: var(--teal-deep);
  color: #fff;
  border-color: var(--teal-deep);
}

.sop-list { display: flex; flex-direction: column; gap: 10px; }

.sop-row {
  display: grid;
  grid-template-columns: 64px 1fr 16px;
  gap: 12px;
  align-items: center;
  width: 100%;
  text-align: left;
  border: 1px solid var(--line);
  background: #fff;
  border-radius: 16px;
  padding: 12px;
  cursor: pointer;
  box-shadow: 0 8px 24px rgba(15, 23, 42, 0.04);
}

.sop-glyph {
  width: 64px;
  height: 52px;
  border-radius: 12px;
  background: #ecfdf5;
  color: var(--teal-deep);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 0.78rem;
}

.sop-row strong { display: block; font-size: 0.95rem; }
.sop-row span { display: block; color: var(--muted); font-size: 0.78rem; margin-top: 2px; line-height: 1.35; }
.chev { color: #94a3b8; }

.btn {
  width: 100%;
  border: 0;
  border-radius: 14px;
  padding: 14px 16px;
  font-weight: 800;
  background: linear-gradient(135deg, var(--teal), #2dd4bf);
  color: #042f2e;
  cursor: pointer;
}

.btn.ghost {
  background: #fff;
  border: 1px solid var(--line);
  color: var(--ink);
}

.warn-banner {
  background: var(--warn-bg);
  color: var(--warn);
  border-radius: 14px;
  padding: 12px 14px;
  font-size: 0.85rem;
  font-weight: 600;
  margin-bottom: 14px;
  line-height: 1.45;
}

.empty { text-align: center; color: var(--muted); padding: 28px 10px; }
.guideline-b { text-align: left; }
.guideline-b .empty-kicker { margin: 0 0 6px; font-size: .72rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: #9a3412; }
.guideline-b h3 { margin: 0 0 8px; }

.detail-head { margin-bottom: 14px; }
.detail-code {
  display: inline-flex;
  background: #ecfdf5;
  color: var(--teal-deep);
  font-weight: 800;
  font-size: 0.75rem;
  padding: 5px 9px;
  border-radius: 999px;
  letter-spacing: 0.06em;
}
.detail-head h2 { margin: 10px 0 6px; font-size: 1.4rem; letter-spacing: -0.04em; }
.detail-head p { margin: 0; color: var(--muted); }
.detail-head .doc-control { margin-top: 8px; font-size: .76rem; font-weight: 700; }

.player {
  position: relative;
  border-radius: 18px;
  overflow: hidden;
  background: #042f2e;
  color: #ecfdf5;
  aspect-ratio: 16 / 10;
  margin: 0 0 16px;
  box-shadow: var(--shadow);
}

.player-stage {
  position: absolute;
  inset: 0;
  padding: 22px 18px 52px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  background:
    radial-gradient(80% 70% at 90% 0%, rgba(45, 212, 191, 0.35), transparent 50%),
    linear-gradient(180deg, #0f766e 0%, #042f2e 72%);
}

.scene-visual { position: absolute; inset: 18px 18px auto; height: 48%; display: flex; align-items: flex-end; justify-content: center; gap: 12px; }
.scene-visual span { width: 22%; height: 60%; border-radius: 14px 14px 4px 4px; background: linear-gradient(180deg,#99f6e4,#14b8a6); animation: briefing 1.4s ease-in-out infinite alternate; box-shadow: 0 12px 30px rgba(45,212,191,.18); }
.scene-visual span:nth-child(2) { height: 88%; animation-delay: .25s; }
.scene-visual span:nth-child(3) { height: 72%; animation-delay: .5s; }
@keyframes briefing { from { transform: translateY(5px); opacity: .72; } to { transform: translateY(-5px); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .scene-visual span { animation: none; } }

.player-kicker {
  font-size: 0.68rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  font-weight: 800;
  color: var(--cyan);
  margin: 0 0 8px;
}

.player-stage h3 { margin: 0 0 8px; font-size: 1.35rem; letter-spacing: -0.03em; }
.player-stage p { margin: 0; font-size: 0.95rem; line-height: 1.45; color: rgba(236, 253, 245, 0.9); }

.player-bar {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 44px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 12px;
  background: rgba(2, 6, 23, 0.45);
}

.player-bar button {
  border: 0;
  background: #fff;
  color: #042f2e;
  font-weight: 800;
  border-radius: 999px;
  padding: 6px 10px;
  font-size: .72rem;
  cursor: pointer;
}

.player-progress {
  flex: 1;
  height: 6px;
  border-radius: 99px;
  background: rgba(255,255,255,0.2);
  overflow: hidden;
  cursor: pointer;
}

.player-progress > span {
  display: block;
  height: 100%;
  width: 0;
  background: var(--cyan);
}

.player-time { font-size: 0.72rem; font-weight: 700; color: #ccfbf1; min-width: 64px; text-align: right; }

.block {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 14px 16px;
  margin-bottom: 10px;
}

.block h3 { margin: 0 0 8px; font-size: 0.95rem; }
.block p, .block li { color: var(--ink-soft); font-size: 0.9rem; line-height: 1.5; }
.block ul { margin: 0; padding-left: 18px; }
.block li { margin: 4px 0; }

.rule-list { display: flex; flex-direction: column; gap: 8px; }
.rule {
  background: #fff;
  border-left: 4px solid var(--teal);
  border-radius: 12px;
  padding: 12px 14px;
  font-size: 0.9rem;
  line-height: 1.45;
}

.install ol { margin: 0; padding-left: 18px; }
.install li { margin: 8px 0; line-height: 1.45; }

.competency { border-color: rgba(13,148,136,.35); box-shadow: 0 12px 30px rgba(13,148,136,.08); }
.quiz-question { border: 0; padding: 10px 0 14px; margin: 0; }
.quiz-question legend { font-size: .88rem; font-weight: 800; line-height: 1.4; margin-bottom: 8px; }
.quiz-question label { display: flex; gap: 8px; align-items: flex-start; margin: 7px 0; padding: 9px 10px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; }
.quiz-question input { margin-top: 3px; }
#assessmentResult { min-height: 24px; margin-top: 10px; font-size: .84rem; font-weight: 800; color: var(--teal-deep); }

.tabbar {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: 0;
  width: min(480px, 100%);
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 4px;
  padding: 8px 8px calc(8px + var(--safe-b));
  background: rgba(255,255,255,0.94);
  backdrop-filter: blur(12px);
  border-top: 1px solid var(--line);
}

.tab {
  border: 0;
  background: transparent;
  color: var(--muted);
  font-weight: 800;
  font-size: 0.68rem;
  padding: 6px 4px;
  border-radius: 12px;
  cursor: pointer;
}

.tab.active { color: var(--teal-deep); background: #ecfdf5; }
.tab-ico { display: block; font-size: 1.1rem; margin-bottom: 2px; }
</style>
</head>

      (asked ? " Search did not match “" + escapeHtml(asked) + "”." : "") +
      "</p><ul>" +
      (g.bullets || [])
        .map(function (item) {
          return "<li>" + escapeHtml(item) + "</li>";
        })
        .join("") +
      '</ul><button type="button" class="btn ghost" id="gotoRules">Open house rules</button></section>'
    );
  }

  function sopRowsHtml(list) {
    if (!list.length) return guidelineBHtml(state.query);
    return (
      '<div class="sop-list">' +
      list
        .map(function (sop) {
          return (
            '<button type="button" class="sop-row" data-open="' +
            escapeHtml(sop.id) +
            '">' +
            '<span class="sop-glyph">' +
            escapeHtml(sop.code) +
            "</span>" +
            "<div><strong>" +
            escapeHtml(sop.title) +
            "</strong><span>" +
            escapeHtml(catLabel(sop.category) + " · " + sop.blurb) +
            "</span></div>" +
            '<span class="chev" aria-hidden="true">›</span>' +
            "</button>"
          );
        })
        .join("") +
      "</div>"
    );
  }

  function filterBarHtml() {
    var chips =
      '<button type="button" class="filter' +
      (state.category === "all" ? " active" : "") +
      '" data-cat="all">All</button>' +
      DATA.categories
        .map(function (c) {
          return (
            '<button type="button" class="filter' +
            (state.category === c.id ? " active" : "") +
            '" data-cat="' +
            escapeHtml(c.id) +
            '">' +
            escapeHtml(c.label) +
            "</button>"
          );
        })
        .join("");
    return '<div class="filters" role="tablist" aria-label="Sort by station">' + chips + "</div>";
  }

  function stopPlayer() {
    if (player.timer) {
      clearInterval(player.timer);
      player.timer = null;
    }
    player.playing = false;
    if ("speechSynthesis" in window) window.speechSynthesis.cancel();
  }

  function speakScene(scene) {
    if (!player.narration || !("speechSynthesis" in window)) return;
    window.speechSynthesis.cancel();
    var utterance = new SpeechSynthesisUtterance(scene.title + ". " + scene.line);
    utterance.lang = "en-GB";
    utterance.rate = player.rate;
    var voices = window.speechSynthesis.getVoices();
    var preferred = voices.find(function (v) { return v.lang === "en-GB" && /premium|natural|enhanced/i.test(v.name); }) || voices.find(function (v) { return v.lang === "en-GB"; });
    if (preferred) utterance.voice = preferred;
    window.speechSynthesis.speak(utterance);
  }

  function currentScene(sop, t) {
    var scenes = sop.video.scenes;
    var cur = scenes[0];
    for (var i = 0; i < scenes.length; i++) {
      if (t >= scenes[i].t) cur = scenes[i];
    }
    return cur;
  }

  function fmtTime(sec) {
    var s = Math.max(0, Math.floor(sec));
    var m = Math.floor(s / 60);
    var r = s % 60;
    return m + ":" + (r < 10 ? "0" : "") + r;
  }

  function paintPlayer(sop) {
    var stage = document.getElementById("playerStage");
    var fill = document.getElementById("playerFill");
    var time = document.getElementById("playerTime");
    var toggle = document.getElementById("playerToggle");
    if (!stage || !sop.video) return;
    var scene = currentScene(sop, player.t);
    var dur = sop.video.durationSec;
    stage.innerHTML =
      '<div class="scene-visual" aria-hidden="true"><span></span><span></span><span></span></div><p class="player-kicker">Narrated animation · ' +
      escapeHtml(catLabel(sop.category)) +
      "</p><h3>" +
      escapeHtml(scene.title) +
      "</h3><p>" +
      escapeHtml(scene.line) +
      "</p>";
    if (player.playing && player.sceneTitle !== scene.title) {
      player.sceneTitle = scene.title;
      speakScene(scene);
    }
    if (fill) fill.style.width = Math.min(100, (player.t / dur) * 100) + "%";
    if (time) time.textContent = fmtTime(player.t) + " / " + fmtTime(dur);
    if (toggle) toggle.textContent = player.playing ? "Pause" : "Play";
  }

  function startPlayer(sop) {
    stopPlayer();
    player.sopId = sop.id;
    player.playing = true;
    player.timer = setInterval(function () {
      if (!player.playing) return;
      player.t += 0.25;
      if (player.t >= sop.video.durationSec) {
        player.t = sop.video.durationSec;
        stopPlayer();
        completed[sop.id] = { version: sop.revision, completedAt: new Date().toISOString() };
        localStorage.setItem("kiteline-sop-completed-v1", JSON.stringify(completed));
        recordEvidence("training.completed", sop, { durationSec: sop.video.durationSec, narrated: player.narration });
      }
      paintPlayer(sop);
    }, 250);
    paintPlayer(sop);
  }

  function renderSops() {
    screenTitle.textContent = "All SOPs";
    brandMark.textContent = DATA.company;
    backBtn.hidden = true;
    var list = filteredSops();
    main.innerHTML =
      '<div class="warn-banner">Professional commercial kitchen only — hotels, restaurants, catering, schools, production. Not home cooking.</div>' +
      filterBarHtml() +
      '<p class="section-label">' +
      list.length +
      " procedures</p>" +
      sopRowsHtml(list);
  }

  function renderVideos() {
    screenTitle.textContent = "Narrated training";
    brandMark.textContent = DATA.company;
    backBtn.hidden = true;
    var list = filteredSops();
    var rows = list
      .map(function (sop) {
        return (
          '<button type="button" class="sop-row" data-open="' +
          escapeHtml(sop.id) +
          '">' +
          '<span class="sop-glyph">▶</span>' +
          "<div><strong>" +
          escapeHtml(sop.video.title) +
          "</strong><span>" +
          escapeHtml(sop.code + " · " + catLabel(sop.category) + " · " + sop.video.durationSec + "s" + (completed[sop.id] && completed[sop.id].version === sop.revision ? " · Completed" : "")) +
          "</span></div>" +
          '<span class="chev">›</span></button>'
        );
      })
      .join("");
    main.innerHTML =
      '<p class="section-label">Sort by station</p>' +
      filterBarHtml() +
      '<p class="section-label">' +
      list.length +
      " narrated briefings</p>" +
      (rows ? '<div class="sop-list">' + rows + "</div>" : guidelineBHtml(state.query));
  }

  function renderRules() {
    screenTitle.textContent = "House rules";
    brandMark.textContent = DATA.company;
    backBtn.hidden = true;
    main.innerHTML =
      '<div class="warn-banner">Post these on the pass. Every starter signs CK-00, CK-06 and Guideline B.</div>' +
      guidelineBHtml("") +
      '<div class="rule-list">' +
      DATA.hardRules
        .map(function (r) {
          return '<div class="rule">' + escapeHtml(r) + "</div>";
        })
        .join("") +
      "</div>";
  }

  function renderInstall() {
    screenTitle.textContent = "Install";
    brandMark.textContent = DATA.company;
    backBtn.hidden = true;
    var installBtn = state.deferredPrompt
      ? '<button type="button" class="btn" id="installBtn">Install this app</button>'
      : "";
    main.innerHTML =
      '<section class="block install"><h3>Android (Chrome)</h3>' +
      "<ol><li>Open this page in Chrome.</li><li>Menu ⋮ → <b>Install app</b> or <b>Add to Home screen</b>.</li><li>Open Kitchen SOP from the home screen.</li></ol></section>" +
      '<section class="block install"><h3>iPhone / iPad (Safari)</h3>' +
      "<ol><li>Open this page in Safari.</li><li>Share □↑ → <b>Add to Home Screen</b>.</li><li>Tap Add. Works offline after first open.</li></ol></section>" +
      installBtn +
      '<p class="section-label" style="margin-top:18px">For</p>' +
      "<p>" +
      escapeHtml(DATA.audience) +
      "</p>";
  }

  function renderDetail(sop) {
    screenTitle.textContent = sop.code;
    brandMark.textContent = DATA.company;
    backBtn.hidden = false;
    var sections = sop.sections
      .map(function (sec) {
        var inner = "";
        if (sec.body) inner += "<p>" + escapeHtml(sec.body) + "</p>";
        if (sec.bullets && sec.bullets.length) {
          inner +=
            "<ul>" +
            sec.bullets
              .map(function (b) {
                return "<li>" + escapeHtml(b) + "</li>";
              })
              .join("") +
            "</ul>";
        }
        return '<article class="block"><h3>' + escapeHtml(sec.h) + "</h3>" + inner + "</article>";
      })
      .join("");

    main.innerHTML =
      '<div class="detail-head"><div class="detail-code">' +
      escapeHtml(sop.code + " · " + catLabel(sop.category)) +
      "</div><h2>" +
      escapeHtml(sop.title) +
      "</h2><p>" +
      escapeHtml(sop.blurb) +
      "</p><p class=\"doc-control\">Version " + escapeHtml(sop.revision) + " · Effective " + escapeHtml(sop.effectiveDate) + " · Review " + escapeHtml(sop.reviewDate) + "</p></div>" +
      '<div class="player" id="sopPlayer">' +
      '<div class="player-stage" id="playerStage"></div>' +
      '<div class="player-bar">' +
      '<button type="button" id="playerToggle">Play</button>' +
      '<button type="button" id="narrationToggle" aria-pressed="true">Voice on</button>' +
      '<div class="player-progress" id="playerSeek" role="slider" aria-label="Training progress" tabindex="0"><span id="playerFill"></span></div>' +
      '<div class="player-time" id="playerTime"></div></div></div>' +
      sections + assessmentHtml(sop);

    if (player.sopId !== sop.id) {
      player.t = 0;
      player.sopId = sop.id;
      stopPlayer();
    }
    paintPlayer(sop);
  }

  function assessmentHtml(sop) {
    var prior = competencyResults[sop.id];
    var questions = sop.assessment.questions.map(function (q, qi) {
      return '<fieldset class="quiz-question"><legend>' + (qi + 1) + '. ' + escapeHtml(q.prompt) + '</legend>' + q.options.map(function (option, oi) {
        return '<label><input type="radio" name="q' + qi + '" value="' + oi + '"> <span>' + escapeHtml(option) + '</span></label>';
      }).join("") + '</fieldset>';
    }).join("");
    return '<section class="block competency"><h3>Competency check</h3><p>Pass mark: 100%. Results are stored offline with the controlled SOP version.</p>' + questions + '<button type="button" class="btn" id="submitAssessment">Submit competency check</button><div id="assessmentResult" role="status" aria-live="polite">' + (prior ? escapeHtml("Previous result: " + prior.score + "% · " + (prior.passed ? "Passed" : "Retraining required")) : "") + '</div></section>' +
      '<section class="block"><h3>Evidence & audit</h3><ul>' + sop.evidenceRequired.map(function (item) { return '<li>' + escapeHtml(item) + '</li>'; }).join("") + '</ul><button type="button" class="btn ghost" id="exportEvidence">Export offline evidence ledger</button></section>';
  }

  function setTabActive(tab) {
    tabs.forEach(function (btn) {
      var on = btn.getAttribute("data-tab") === tab;
      btn.classList.toggle("active", on);
      if (on) btn.setAttribute("aria-current", "page");
      else btn.removeAttribute("aria-current");
    });
  }

  function render() {
    main.style.animation = "none";
    main.offsetHeight;
    main.style.animation = "";

    if (state.sopId) {
      var sop = findSop(state.sopId);
      if (sop) {
        setTabActive(state.tab === "videos" ? "videos" : "sops");
        renderDetail(sop);
        return;
      }
      state.sopId = null;
    }

    stopPlayer();
    setTabActive(state.tab);
    if (state.tab === "home") renderHome();
    else if (state.tab === "sops") renderSops();
    else if (state.tab === "videos") renderVideos();
    else if (state.tab === "rules") renderRules();
    else renderInstall();
  }

  function goTab(tab) {
    state.tab = tab;
    state.sopId = null;
    if (tab !== "sops" && tab !== "videos") {
      state.searchOpen = false;
      searchBar.hidden = true;
    }
    render();
  }

  document.querySelector(".tabbar").addEventListener("click", function (e) {
    var btn = e.target.closest(".tab");
    if (!btn) return;
    goTab(btn.getAttribute("data-tab"));
  });

  backBtn.addEventListener("click", function () {
    state.sopId = null;
    if (state.tab !== "videos") state.tab = "sops";
    render();
  });

  searchToggle.addEventListener("click", function () {
    if (state.tab !== "videos") state.tab = "sops";
    state.sopId = null;
    state.searchOpen = !state.searchOpen;
    searchBar.hidden = !state.searchOpen;
    render();
    if (state.searchOpen) searchInput.focus();
  });

  searchInput.addEventListener("input", function () {
    state.query = searchInput.value;
    if (state.tab !== "videos") state.tab = "sops";
    state.sopId = null;
    render();
  });

  main.addEventListener("click", function (e) {
    var cat = e.target.closest("[data-cat]");
    if (cat) {
      state.category = cat.getAttribute("data-cat");
      render();
      return;
    }
    var open = e.target.closest("[data-open]");
    if (open) {
      state.sopId = open.getAttribute("data-open");
      searchBar.hidden = true;
      state.searchOpen = false;
      player.t = 0;
      stopPlayer();
      render();
      window.scrollTo(0, 0);
      return;
    }
    if (e.target.id === "gotoSops") {
      goTab("sops");
      return;
    }
    if (e.target.id === "gotoVideos") {
      goTab("videos");
      return;
    }
    if (e.target.id === "gotoInstall") {
      goTab("install");
      return;
    }
    if (e.target.id === "gotoRules") {
      goTab("rules");
      return;
    }
    if (e.target.id === "playerToggle") {
      var sop = findSop(state.sopId);
      if (!sop) return;
      if (player.playing) {
        player.playing = false;
        stopPlayer();
        paintPlayer(sop);
      } else {
        if (player.t >= sop.video.durationSec) player.t = 0;
        startPlayer(sop);
      }
      return;
    }
    if (e.target.id === "narrationToggle") {
      player.narration = !player.narration;
      e.target.textContent = player.narration ? "Voice on" : "Voice off";
      e.target.setAttribute("aria-pressed", player.narration ? "true" : "false");
      if (!player.narration && "speechSynthesis" in window) window.speechSynthesis.cancel();
      return;
    }
    var seek = e.target.closest("#playerSeek");
    if (seek) {
      var sopSeek = findSop(state.sopId);
      var rect = seek.getBoundingClientRect();
      player.t = Math.max(0, Math.min(sopSeek.video.durationSec, ((e.clientX - rect.left) / rect.width) * sopSeek.video.durationSec));
      player.sceneTitle = null;
      paintPlayer(sopSeek);
      return;
    }
    if (e.target.id === "submitAssessment") {
      var assessedSop = findSop(state.sopId);
      var answers = assessedSop.assessment.questions.map(function (_, qi) {
        var selected = main.querySelector('input[name="q' + qi + '"]:checked');
        return selected ? Number(selected.value) : -1;
      });
      var correct = answers.filter(function (answer, qi) { return answer === assessedSop.assessment.questions[qi].correctIndex; }).length;
      var score = Math.round((correct / answers.length) * 100);
      var passed = score >= assessedSop.assessment.passPercent;
      competencyResults[assessedSop.id] = { score: score, passed: passed, sopVersion: assessedSop.revision, attemptedAt: new Date().toISOString() };
      localStorage.setItem("kiteline-sop-competency-v1", JSON.stringify(competencyResults));
      recordEvidence(passed ? "competency.passed" : "competency.retraining_required", assessedSop, { score: score, answersComplete: answers.indexOf(-1) === -1 });
      document.getElementById("assessmentResult").textContent = passed ? "Passed: " + score + "%. Manager sign-off may now be completed." : "Score: " + score + "%. Review this SOP and repeat the check.";
      return;
    }
    if (e.target.id === "exportEvidence") {
      var blob = new Blob([JSON.stringify({ schemaVersion: 1, exportedAt: new Date().toISOString(), records: evidenceLedger }, null, 2)], { type: "application/json" });
      var link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "kiteline-sop-evidence-" + new Date().toISOString().slice(0, 10) + ".json";
      link.click();
      URL.revokeObjectURL(link.href);
      return;
    }
    if (e.target.id === "installBtn" && state.deferredPrompt) {
      state.deferredPrompt.prompt();
      state.deferredPrompt.userChoice.finally(function () {
        state.deferredPrompt = null;
        render();
      });
    }
  });

  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    state.deferredPrompt = e;
  });

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js", { scope: "./" }).catch(function () {});
    });
  }

  function updateNetworkStatus() {
    if (!networkStatus) return;
    networkStatus.hidden = navigator.onLine;
    networkStatus.textContent = navigator.onLine ? "" : "Offline mode — saved SOPs and training remain available; updates resume when connected.";
  }
  window.addEventListener("online", updateNetworkStatus);
  window.addEventListener("offline", updateNetworkStatus);
  updateNetworkStatus();

  render();
})();
</script>
</body>
</html>
