name: Parslia
options:
  bundleIdPrefix: app.parslia
  deploymentTarget:
    iOS: "17.0"
targets:
  Parslia:
    type: application
    platform: iOS
    sources: [Parslia]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.parslia.kitchen
        PRODUCT_NAME: Parslia
        SWIFT_VERSION: 5.10
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Parslia/Info.plist
      properties:
        CFBundleDisplayName: Parslia
        UILaunchScreen: {}
        NSCameraUsageDescription: Parslia uses the camera only when you choose to add a kitchen image.
        NSMicrophoneUsageDescription: Parslia uses the microphone only when you choose voice input.
        ITSAppUsesNonExemptEncryption: false
    scheme:
      testTargets: [ParsliaTests]
      storeKitConfiguration: Parslia/Parslia.storekit
  ParsliaTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ParsliaTests]
    dependencies:
      - target: Parslia
